worker_processes 1;
events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 2027;

    # The case-engine bakes its own bind address (0.0.0.0, required for Docker
    # port publishing) into the OpenAPI "servers" URL, so Swagger UI's
    # "Try it out" sends requests to the unreachable http://0.0.0.0:2027.
    # Rewrite just that one response so the browser gets a usable host.
    location = /api-docs/swagger.json {
      proxy_pass http://case-engine:2027/api-docs/swagger.json;
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding "";
      sub_filter 'http://0.0.0.0:2027' 'http://localhost:2027';
      sub_filter_once off;
      sub_filter_types application/json;
    }

    location / {
      proxy_pass http://case-engine:2027;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
