# Serves the React build and forwards API calls to the backend container ("backend" in docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app routes with #/..., so every other path is the app itself; index.html is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
